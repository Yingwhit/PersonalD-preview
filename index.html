const id = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
function dayKey(value = new Date()) {

}
const isRepeat = task => Boolean(task.repeat && task.repeat.kind !== 'none');
function nextDue(completedAt, rule) {
  const date = new Date(completedAt);
  if (rule.kind === 'interval') {
    if (!Number.isInteger(rule.days) || rule.days < 1 || rule.days > 3650) throw Error('间隔天数应为 1–3650');
    date.setDate(date.getDate() + rule.days);
  } else if (rule.kind === 'weekly') {
    if (!rule.weekdays?.length || rule.weekdays.some(day => !Number.isInteger(day) || day < 1 || day > 7)) throw Error('请至少选择一个星期');
    do { date.setDate(date.getDate() + 1); } while (!rule.weekdays.includes(date.getDay() || 7));
  } else if (rule.kind === 'monthly') {
    if (!Number.isInteger(rule.day) || rule.day < 1 || rule.day > 31) throw Error('每月日期应为 1–31');
    const original = date.getDate();
    const year = date.getFullYear(), month = date.getMonth();
    const thisDay = Math.min(rule.day, new Date(year, month + 1, 0).getDate());
    date.setDate(1);
    if (thisDay <= original) date.setMonth(month + 1);
    date.setDate(Math.min(rule.day, new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate()));
  } else throw Error('请选择重复规则');
  return date.getTime();
}
function completeTask(state, taskId, at = Date.now()) {
  const task = state.tasks.find(task => task.id === taskId);
  if (!task || task.completedAt) return;
  task.completedAt = at;
  if (isRepeat(task) && !state.tasks.some(next => next.previousId === task.id)) {
    state.tasks.push({ ...task, repeat: structuredClone(task.repeat), id: id(), previousId: task.id,
      createdAt: at, dueAt: nextDue(at, task.repeat), completedAt: null });

}
function seriesFor(state, task) {
  const byId = new Map(state.tasks.map(task => [task.id, task]));
  function root(record) {
    const visited = new Set();
    while (record.previousId && byId.has(record.previousId) && !visited.has(record.id)) {
      visited.add(record.id); record = byId.get(record.previousId);

    return record.id;
  }

function statsFor(state, task) {
  const dates = seriesFor(state, task).filter(task => task.completedAt).map(task => task.completedAt).sort((a,b) => a-b);
  // Local calendar days, matching the Android app's day-based statistic.
  const ordinal = time => { const d = new Date(time); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000; };
  return { count: dates.length, average: dates.length < 2 ? null : (ordinal(dates.at(-1)) - ordinal(dates[0])) / (dates.length - 1) };
}
function saveTask(state, updated, now = Date.now()) {
  const original = state.tasks.find(task => task.id === updated.id);
  if (!original) { state.tasks.push(updated); return; }
  const becameRepeat = original.completedAt && !isRepeat(original) && isRepeat(updated);
  const changedRule = JSON.stringify(original.repeat) !== JSON.stringify(updated.repeat);
  Object.assign(original, updated);
  if (becameRepeat) {
    state.tasks.push({ ...updated, id: id(), createdAt: now, dueAt: nextDue(original.completedAt, updated.repeat),
      previousId: original.id, completedAt: null });
  } else if (changedRule) {
    const series = seriesFor(state, original);
    const completed = series.map(task => task.completedAt).filter(Boolean);
    const anchor = completed.length ? Math.max(...completed) : now;
    series.filter(task => !task.completedAt).forEach(task => {
      task.repeat = structuredClone(updated.repeat);
      if (isRepeat(task)) task.dueAt = nextDue(anchor, task.repeat);
    });
  }
}
function moveCompletion(state, taskId, targetDay) {
  const task = state.tasks.find(task => task.id === taskId);
  if (!task?.completedAt) return;
  const before = new Date(task.completedAt);
  const moved = new Date(`${targetDay}T00:00:00`);
  moved.setHours(before.getHours(), before.getMinutes(), before.getSeconds(), before.getMilliseconds());
  task.completedAt = moved.getTime();
  const next = state.tasks.find(next => next.previousId === task.id && !next.completedAt);
  if (next && isRepeat(next)) next.dueAt = nextDue(task.completedAt, next.repeat);

function deleteTask(state, taskId, mode) {
  const task = state.tasks.find(task => task.id === taskId);

  if (!isRepeat(task)) { state.tasks = state.tasks.filter(task => task.id !== taskId); return; }
  if (!['stop', 'all'].includes(mode)) throw Error('请先选择处理范围');
  const group = new Set(seriesFor(state, task).filter(task => mode === 'all' || !task.completedAt).map(task => task.id));

  return {

      {id:'PET',name:'宠物',color:'#d39a88',icon:'♧'},{id:'PERSONAL',name:'个人',color:'#9c98bc',icon:'✳'},{id:'OTHER',name:'其他',color:'#7d9daf',icon:'○'}],
    items:[{id:'litter',name:'猫砂盆',note:'把日常照顾和定期清洗都放在一起。'},{id:'purifier',name:'空气净化器',note:'滤芯检查与更换'}],

      make('给绿植浇水','PERSONAL',{repeat:{kind:'weekly',weekdays:[2,6]}}),

      make('检查空气净化器滤芯','ITEMS',{itemId:'purifier',repeat:{kind:'monthly',day:15},dueAt:nextDue(now,{kind:'monthly',day:15})}),

const off = new Set(["2027-06-09", "2027-09-15"]);
const makeup = new Set(["2026-01-04", "2026-02-14", "2026-02-28", "2026-05-09", "2026-09-20", "2026-10-10", "2027-01-31", "2027-02-14", "2027-05-08", "2027-09-26", "2027-10-09"]);
for (const [first,last] of [["2026-01-01", "2026-01-03"], ["2026-02-15", "2026-02-23"], ["2026-04-04", "2026-04-06"], ["2026-05-01", "2026-05-05"], ["2026-06-19", "2026-06-21"], ["2026-09-25", "2026-09-27"], ["2026-10-01", "2026-10-07"], ["2027-01-01", "2027-01-03"], ["2027-02-05", "2027-02-13"], ["2027-04-03", "2027-04-05"], ["2027-05-01", "2027-05-05"], ["2027-10-01", "2027-10-07"]]) {

function workStatus(key, overrides = {}) {

function eventsOn(key) {

function calendarPage() {

    return `<div class="calendar-cell ${key===selectedDay?'selected':''}" data-day="${key}" tabindex="0" role="button" aria-label="${key}，${events.length} 项"><div class="day-number"><span class="${key===dayKey()?'is-today':''}">${d}</span><small class="${work.working?'':'rest'}">${work.working?'班':'休'}</small></div>${events.slice(0,3).map(event=>`<button class="calendar-event ${event.completedAt?'event-done':''}" style="--category:${event.color}" data-action="${event.type==='task'?'task':'timer-record'}" data-id="${h(event.id)}" ${event.type==='task'&&event.completedAt?`draggable="true" data-drag="${h(event.id)}"`:''} title="${h(event.title)}">${h(event.title)}</button>`).join('')}${events.length>3?`<span class="calendar-more">＋${events.length-3} 项</span>`:''}</div>`;
  }).join('');
  return header('让每一点进展，都有迹可循','生活日历','选择日期查看完整记录；拖动已完成事项可调整完成日期。')+
    `<div class="calendar-layout"><section class="calendar-panel"><div class="month-toolbar"><div><h2>${first.getFullYear()} 年 <b>${first.getMonth()+1} 月</b></h2><span class="small muted">中国大陆 · 班休安排</span></div><div>${action('month-prev','‹','','icon-button')}${action('month-today','今天','','button subtle')}${action('month-next','›','','icon-button')}</div></div><div class="weekday-row">${'一二三四五六日'.split('').map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-grid">${cells}</div><div class="calendar-legend">${state.categories.map(c=>`<span><i style="background:${c.color}"></i>${h(c.name)}</span>`).join('')}</div></section>

document.addEventListener('click',event=>{
  const nav=event.target.closest('[data-page]');if(nav){page=nav.dataset.page;location.hash=page;render();window.scrollTo(0,0);return;}
  const filterButton=event.target.closest('[data-filter]');if(filterButton){filter=filterButton.dataset.filter;taskTab='tasks';render();return;}
  const button=event.target.closest('[data-action]');
  if(button){event.preventDefault();const name=button.dataset.action,key=button.dataset.id;
    try {
      if(name==='close')close();
      else if(name==='task')taskForm(key);
      else if(name==='add-task'||name==='add-related')taskForm('',name==='add-related'?key:'');
      else if(name==='delete-prompt')deletionForm(key);
      else if(name==='complete') {
        const task=state.tasks.find(t=>t.id===key);
        if(task.completedAt){const next=state.tasks.find(t=>t.previousId===key);if(next?.completedAt)throw Error('后续已有完成记录，请从最近一次开始撤销');if(next)state.tasks=state.tasks.filter(t=>t.id!==next.id);task.completedAt=null;}
        else completeTask(state,key);
        close();commit(task.completedAt?'完成了一件小事，记下了 ✓':'已撤销完成');
      }
      else if(name==='items-tab'){taskTab=taskTab==='items'?'tasks':'items';render();}
      else if(name==='item-expand'){expandedItem=expandedItem===key?'':key;render();}
      else if(name==='category-edit')simpleForm('categories',key);
      else if(['add-item','categories','timer-category','add-shop','shop-detail','work-edit','move-date'].includes(name))simpleForm(name,key);
      else if(name==='timer-start')timerForm(key);
      else if(name==='timer-pause') {const timer=state.timers.find(t=>t.id===key);if(timer.startedAt){timer.elapsed=elapsed(timer);timer.startedAt=null;}else timer.startedAt=Date.now();commit();}
      else if(name==='timer-finish'){finishTimer(state,key);commit('这段时间已记录到日历');}
      else if(name==='timer-record'){const timer=state.timers.find(t=>t.id===key);toast(`${timer.title} · ${clock(timer.elapsed)}`);}
      else if(name==='timer-history'){timerHistory=!timerHistory;render();}
      else if(name==='shopping-history'){shoppingHistory=!shoppingHistory;render();}
      else if(name==='purchase'){const entry=state.shopping.find(e=>e.id===key);entry.purchasedAt=entry.purchasedAt?null:Date.now();close();commit(entry.purchasedAt?'已购买，保留在购买历史中':'已恢复待购买');}
      else if(name==='month-prev'||name==='month-next'){const date=new Date(`${month}-01T12:00:00`);date.setMonth(date.getMonth()+(name==='month-next'?1:-1));month=dayKey(date).slice(0,7);render();}
      else if(name==='month-today'){selectedDay=dayKey();month=selectedDay.slice(0,7);render();}
      else if(name==='work-reset'){delete state.overrides[selectedDay];close();commit('已恢复默认班休安排');}
    }catch(error){toast(error.message);}return;
  }
  const day=event.target.closest('[data-day]');if(day){selectedDay=day.dataset.day;render();}
});
document.addEventListener('keydown',event=>{if(event.target.matches('[data-day]')&&['Enter',' '].includes(event.key)){event.preventDefault();selectedDay=event.target.dataset.day;render();}});
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)close();}});
dialog.addEventListener('change',event=>{
  if(event.target.id==='repeat-kind'){
    const kind=event.target.value;
    for(const type of ['interval','weekly','monthly'])document.querySelector(`#${type}-fields`).hidden=type!==kind;
    const note=document.querySelector('#conversion-note');if(note)note.hidden=kind==='none';
    for(const type of ['days','monthDay'])dialog.querySelector(`[name=${type}]`).disabled=kind!==(type==='days'?'interval':'monthly');
  }
  if(event.target.id==='timer-mode'){const up=event.target.value==='up';document.querySelector('#minutes-label').hidden=up;dialog.querySelector('[name=minutes]').disabled=up;}
  if(event.target.name==='mode'&&event.target.closest('#delete-form'))dialog.querySelector('[type=submit]').disabled=false;
});
dialog.addEventListener('submit',event=>{
  event.preventDefault();const form=event.target,data=new FormData(form),key=form.dataset.id;
  try {
    if(form.id==='task-form'){
      const existing=state.tasks.find(t=>t.id===key),kind=data.get('kind');
      const rule=kind==='interval'?{kind,days:Number(data.get('days'))}:kind==='weekly'?{kind,weekdays:data.getAll('weekdays').map(Number)}:kind==='monthly'?{kind,day:Number(data.get('monthDay'))}:{kind:'none'};
      if(rule.kind!=='none')nextDue(Date.now(),rule);
      const title=data.get('title').trim();if(!title)throw Error('请填写事项名称');
      let dueAt=data.get('dueAt')?new Date(data.get('dueAt')+'T12:00:00').getTime():null;
      if(!existing&&rule.kind!=='none'&&!dueAt)dueAt=nextDue(Date.now(),rule);
      saveTask(state,{...(existing||{id:key,createdAt:Date.now(),completedAt:null}),title,note:data.get('note').trim(),category:data.get('category'),itemId:data.get('itemId'),important:data.has('important'),repeat:rule,dueAt});
      close();commit(existing?'修改已保存':'事项已记下');
    } else if(form.id==='delete-form'){deleteTask(state,key,data.get('mode'));close();commit('已按选择处理事项');}
    else if(form.id==='timer-form'){const title=data.get('title').trim();if(!title)throw Error('请填写计时标题');const minutes=Number(data.get('minutes'));if(data.get('mode')==='down'&&(!Number.isInteger(minutes)||minutes<1||minutes>1440))throw Error('时长应为 1–1440 分钟');startTimer(state,{id:id(),title,category:key,createdAt:Date.now(),startedAt:Date.now(),elapsed:0,completedAt:null,target:data.get('mode')==='up'?null:minutes*60});close();commit('开始专注这一件事');}
    else if(form.id==='simple-form'){const name=data.get('name').trim();if(!name)throw Error('请填写名称');if(form.dataset.kind==='add-item'){state.items.push({id:id(),name,note:data.get('note').trim()});taskTab='items';}else state.timerCategories.push({id:id(),name,icon:'◷'});close();commit('已添加');}
    else if(form.id==='category-form'){const name=data.get('name').trim();if(!name)throw Error('请填写分类名称');const existing=state.categories.find(c=>c.id===key);if(existing)Object.assign(existing,{name,color:data.get('color')});else state.categories.push({id:id(),name,color:data.get('color'),icon:'○'});close();commit('分类已保存');}
    else if(form.id==='shop-form'){const name=data.get('name').trim();if(!name)throw Error('请填写物品名称');const price=data.get('price')===''?null:Number(data.get('price'));if(price!=null&&(!Number.isFinite(price)||price<0||Math.abs(price*100-Math.round(price*100))>0.0001))throw Error('价格须为非负金额，最多两位小数');state.shopping.push({id:id(),name,note:data.get('note').trim(),price,need:data.get('need'),createdAt:Date.now(),purchasedAt:null});close();commit('已加入购物清单');}
    else if(form.id==='work-form'){const working=data.has('working'),start=data.get('start'),end=data.get('end');if(working&&start>=end)throw Error('下班时间应晚于上班时间');state.overrides[selectedDay]={working,start,end};close();commit('当天班次已调整');}
    else if(form.id==='move-form'){moveCompletion(state,key,data.get('day'));selectedDay=data.get('day');month=selectedDay.slice(0,7);close();commit('完成日期已更新，下次日期已同步计算');}
  }catch(error){const node=form.querySelector('.form-error');if(node)node.textContent=error.message;else toast(error.message);}
});
document.addEventListener('dragstart',event=>{const node=event.target.closest('[data-drag]');if(node){dragged=node.dataset.drag;event.dataTransfer.setData('text/plain',dragged);event.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',event=>{const target=event.target.closest('[data-day]');if(target&&dragged){event.preventDefault();target.classList.add('drop-target');}});
document.addEventListener('dragleave',event=>event.target.closest('[data-day]')?.classList.remove('drop-target'));
document.addEventListener('drop',event=>{const target=event.target.closest('[data-day]');if(target&&dragged){event.preventDefault();moveCompletion(state,dragged,target.dataset.day);selectedDay=target.dataset.day;dragged=null;commit('完成记录已移动，下次日期已同步更新');}});
document.addEventListener('dragend',()=>{dragged=null;document.querySelectorAll('.drop-target').forEach(node=>node.classList.remove('drop-target'));});
document.querySelector('#reset').onclick=()=>open(`<form id="reset-form"><div class="modal-head"><h2 id="dialog-title">重置预览数据？</h2>${action('close','×','','icon-button')}</div><div class="modal-body"><p>会清除当前浏览器中的预览记录，重新载入示例。手机 App 的数据不会受影响。</p></div><div class="modal-footer">${action('close','取消','','button subtle')}<button class="button destructive" type="submit">确认重置</button></div></form>`);
dialog.addEventListener('submit',event=>{if(event.target.id==='reset-form'){state=seed();close();commit('示例数据已重置');}});
window.addEventListener('hashchange',()=>{if(pages.some(([key])=>key===location.hash.slice(1))){page=location.hash.slice(1);render();}});
window.addEventListener('storage',event=>{if(event.key===KEY&&event.newValue){try{state=JSON.parse(event.newValue);if(!dialog.open)render();}catch{}}});
setInterval(()=>{
  let changed=false;
  for(const timer of state.timers.filter(timer=>!timer.completedAt)){
    if(timer.target!=null&&timer.startedAt&&elapsed(timer)>=timer.target){finishTimer(state,timer.id,Date.now(),true);changed=true;}
    const node=document.querySelector(`[data-clock="${timer.id}"]`);if(node)node.textContent=clock(timer.target==null?elapsed(timer):timer.target-elapsed(timer));
  }
  if(changed)commit('倒计时结束，已记录到日历');
},500);
// Polling preserves local data and waits for open forms to close before refreshing code changes.
let version=null;
const bundled=document.documentElement.dataset.previewBundle==='true';
if(location.protocol.startsWith('http'))setInterval(async()=>{try{const response=await fetch(bundled?location.pathname:'./__version',{cache:'no-store'});if(!response.ok)return;const latest=await response.text();if(version&&latest!==version&&!dialog.open)location.reload();else if(!version)version=latest;}catch{}},bundled?15000:1800);
persist();render();

</script>
</body>
