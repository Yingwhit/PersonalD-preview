v>\n  \u003cdialog id=\"editor\" aria-labelledby=\"dialog-title\">\u003c/dialog>\n  \u003cdiv id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n  \u003cscript type=\"module\">\nconst id = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;\nfunction dayKey(value = new Date()) {\n  const date = new Date(value);\n  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;\n}\nconst isRepeat = task => Boolean(task.repeat && task.repeat.kind !== 'none');\nfunction nextDue(completedAt, rule) {\n  const date = new Date(completedAt);\n  if (rule.kind === 'interval') {\n    if (!Number.isInteger(rule.days) || rule.days \u003c 1 || rule.days > 3650) throw Error('间隔天数应为 1–3650');\n    date.setDate(date.getDate() + rule.days);\n  } else if (rule.kind === 'weekly') {\n    if (!rule.weekdays?.length || rule.weekdays.some(day => !Number.isInteger(day) || day \u003c 1 || day > 7)) throw Error('请至少选择一个星期');\n    do { date.setDate(date.getDate() + 1); } while (!rule.weekdays.includes(date.getDay() || 7));\n  } else if (rule.kind === 'monthly') {\n    if (!Number.isInteger(rule.day) || rule.day \u003c 1 || rule.day > 31) throw Error('每月日期应为 1–31');\n    const original = date.getDate();\n    const year = date.getFullYear(), month = date.getMonth();\n    const thisDay = Math.min(rule.day, new Date(year, month + 1, 0).getDate());\n    date.setDate(1);\n    if (thisDay \u003c= original) date.setMonth(month + 1);\n    date.setDate(Math.min(rule.day, new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate()));\n  } else throw Error('请选择重复规则');\n  return date.getTime();\n}\nfunction completeTask(state, taskId, at = Date.now()) {\n  const task = state.tasks.find(task => task.id === taskId);\n  if (!task || task.completedAt) return;\n  task.completedAt = at;\n  if (isRepeat(task) && !state.tasks.some(next => next.previousId === task.id)) {\n    state.tasks.push({ ...task, repeat: structuredClone(task.repeat), id: id(), previousId: task.id,\n      createdAt: at, dueAt: nextDue(at, task.repeat), completedAt: null,planScope:'date',weekOf:null });\n  }\n}\nfunction seriesFor(state, task) {\n  const byId = new Map(state.tasks.map(task => [task.id, task]));\n  function root(record) {\n    const visited = new Set();\n    while (record.previousId && byId.has(record.previousId) && !visited.has(record.id)) {\n      visited.add(record.id); record = byId.get(record.previousId);\n    }\n    return record.id;\n  }\n  const rootId = root(task);\n  return state.tasks.filter(record => root(record) === rootId);\n}\nfunction statsFor(state, task) {\n  const dates = seriesFor(state, task).filter(task => task.completedAt).map(task => task.completedAt).sort((a,b) => a-b);\n  // Local calendar days, matching the Android app's day-based statistic.\n  const ordinal = time => { const d = new Date(time); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000; };\n  return { count: dates.length, average: dates.length \u003c 2 ? null : (ordinal(dates.at(-1)) - ordinal(dates[0])) / (dates.length - 1) };\n}\nfunction saveTask(state, updated, now = Date.now()) {\n  const original = state.tasks.find(task => task.id === updated.id);\n  if (!original) { state.tasks.push(updated); return; }\n  const becameRepeat = original.completedAt && !isRepeat(original) && isRepeat(updated);\n  const changedRule = JSON.stringify(original.repeat) !== JSON.stringify(updated.repeat);\n  Object.assign(original, updated);\n  if (becameRepeat) {\n    state.tasks.push({ ...updated, id: id(), createdAt: now, dueAt: nextDue(original.completedAt, updated.repeat),\n      previousId: original.id, completedAt: null });\n  } else if (changedRule) {\n    const series = seriesFor(state, original);\n    const completed = series.map(task => task.completedAt).filter(Boolean);\n    const anchor = completed.length ? Math.max(...completed) : now;\n    series.filter(task => !task.completedAt).forEach(task => {\n      task.repeat = structuredClone(updated.repeat);\n      if (isRepeat(task)) task.dueAt = nextDue(anchor, task.repeat);\n    });\n  }\n}\nfunction moveCompletion(state, taskId, targetDay) {\n  const task = state.tasks.find(task => task.id === taskId);\n  if (!task?.completedAt) return;\n  const before = new Date(task.completedAt);\n  const moved = new Date(`${targetDay}T00:00:00`);\n  moved.setHours(before.getHours(), before.getMinutes(), before.getSeconds(), before.getMilliseconds());\n  task.completedAt = moved.getTime();\n  const next = state.tasks.find(next => next.previousId === task.id && !next.completedAt);\n  if (next && isRepeat(next)) next.dueAt = nextDue(task.completedAt, next.repeat);\n}\nfunction deleteTask(state, taskId, mode) {\n  const task = state.tasks.find(task => task.id === taskId);\n  if (!task) return;\n  if (!isRepeat(task)) { state.tasks = state.tasks.filter(task => task.id !== taskId); return; }\n  if (!['stop', 'all'].includes(mode)) throw Error('请先选择处理范围');\n  const group = new Set(seriesFor(state, task).filter(task => mode === 'all' || !task.completedAt).map(task => task.id));\n  state.tasks = state.tasks.filter(task => !group.has(task.id));\n}\nconst visibleTasks = state => state.tasks.filter(task => !(task.completedAt && isRepeat(task)));\n\nconst ideaCategoryId = state => (state.categories.find(c=>c.id==='IDEA')||state.categories.find(c=>c.name==='想法'))?.id||'IDEA';\nfunction migrateState(state) {\n  if ((state.previewSchema||1)\u003c3) {\n    const housework=state.categories.find(category=>category.id==='CLEANING');\n    if(housework?.name==='卫生')housework.name='家务';\n    if(!state.categories.some(c=>c.id==='IDEA'||c.name==='想法'))state.categories.push({id:'IDEA',name:'想法',color:'#b7a16e',icon:'✧'});\n    for(const idea of state.ideas||[]) {\n      if(state.tasks.some(t=>t.id===idea.convertedTaskId||t.importedIdeaId===idea.id))continue;\n      state.tasks.push({id:idea.id,title:idea.title,note:idea.note||'',category:ideaCategoryId(state),createdAt:idea.createdAt,\n        dueAt:null,completedAt:null,repeat:{kind:'none'},important:false,itemId:'',planScope:'none',importedIdeaId:idea.id});\n    }\n    delete state.ideas;\n    state.previewSchema=3;\n  }\n  return state;\n}\nfunction weekRange(now=Date.now()) {\n  const date=new Date(now);date.setHours(12,0,0,0);\n  date.setDate(date.getDate()-((date.getDay()+6)%7));\n  const start=dayKey(date);date.setDate(date.getDate()+6);\n  return {start,end:dayKey(date)};\n}\nfunction discoverGroups(state,{now=Date.now(),category='all',minutes=0,energy='all',search=''}={}) {\n  const today=dayKey(now),week=weekRange(now),rank={low:0,medium:1,high:2};\n  const groups={overdue:[],today:[],week:[],undated:[]};\n  const query=search.trim().toLocaleLowerCase();\n  for(const task of state.tasks) {\n    if(task.completedAt || (category!=='all'&&task.category!==category))continue;\n    if(query&&!`${task.title} ${task.note||''}`.toLocaleLowerCase().includes(query))continue;\n    if(minutes&&(!task.estimatedMinutes||task.estimatedMinutes>minutes))continue;\n    if(energy!=='all'&&(rank[task.energy||'medium']??1)>rank[energy])continue;\n    if(task.planScope==='week'&&!task.dueAt) {\n      if(task.weekOf\u003cweek.start)groups.overdue.push(task);\n      else if(task.weekOf===week.start)groups.week.push(task);\n    } else if(!task.dueAt)groups.undated.push(task);\n    else {\n      const due=dayKey(task.dueAt);\n      if(due\u003ctoday)groups.overdue.push(task);\n      else if(due===today)groups.today.push(task);\n      else if(due\u003c=week.end)groups.week.push(task);\n    }\n  }\n  return groups;\n}\nfunction pickTask(groups,previousId='') {\n  const order=['overdue','today','week','undated'];\n  const urgency=new Map(order.flatMap((group,index)=>groups[group].map(task=>[task.id,index])));\n  let candidates=order.flatMap(group=>groups[group]);\n  if(candidates.length>1)candidates=candidates.filter(task=>task.id!==previousId);\n  // The caller's time and energy constraints have already been applied. Prefer urgency, then importance.\n  return candidates.sort((a,b)=>urgency.get(a.id)-urgency.get(b.id)||Number(Boolean(b.important))-Number(Boolean(a.important)))[0]||null;\n}\nfunction filterDiscoveryScope(groups,scope='all') {\n  const allowed={all:['overdue','today','week','undated'],today:['overdue','today'],week:['overdue','today','week'],undated:['undated']}[scope]||[];\n  return Object.fromEntries(Object.entries(groups).map(([key,tasks])=>[key,allowed.includes(key)?tasks:[]]));\n}\nfunction elapsed(timer, at = Date.now()) {\n  return (timer.elapsed || 0) + (timer.startedAt && !timer.completedAt ? Math.max(0, (at - timer.startedAt) / 1000) : 0);\n}\nfunction startTimer(state, timer) {\n  if (state.timers.some(timer => !timer.completedAt)) throw Error('请先结束当前计时，再开始其他分类');\n  state.timers.push(timer);\n}\nfunction finishTimer(state, timerId, now = Date.now(), automatic = false) {\n  const timer = state.timers.find(timer => timer.id === timerId);\n  if (!timer || timer.completedAt) return;\n  if (automatic && (!timer.startedAt || !timer.target || elapsed(timer, now) \u003c timer.target)) return;\n  const actual = elapsed(timer, now);\n  const end = automatic ? timer.startedAt + (timer.target - timer.elapsed) * 1000 : now;\n  timer.elapsed = automatic ? timer.target : actual;\n  timer.completedAt = end;\n  timer.startedAt = null;\n}\nfunction seed(now = Date.now()) {\n  const today = new Date(now); today.setHours(10, 0, 0, 0);\n  const daysAgo = days => { const date = new Date(today); date.setDate(date.getDate() - days); return date.getTime(); };\n  const make = (title, category, extra = {}) => ({ id: id(), title, category, createdAt: daysAgo(5), dueAt: today.getTime(),\n    completedAt: null, note: '', itemId: '', important: false, repeat: {kind: 'none'}, ...extra });\n  const first = make('铲猫砂', 'PET', {completedAt: daysAgo(2), repeat:{kind:'interval',days:1}, itemId:'litter'});\n  const second = make('铲猫砂', 'PET', {previousId:first.id, completedAt:daysAgo(1), repeat:{kind:'interval',days:1}, itemId:'litter'});\n  return {\n    previewSchema:3,\n    categories: [{id:'CLEANING',name:'家务',color:'#7d9675',icon:'⌂'},{id:'ITEMS',name:'物品',color:'#b28e66',icon:'◇'},\n      {id:'PET',name:'宠物',color:'#d39a88',icon:'♧'},{id:'PERSONAL',name:'个人',color:'#9c98bc',icon:'✳'},{id:'OTHER',name:'其他',color:'#7d9daf',icon:'○'},{id:'IDEA',name:'想法',color:'#b7a16e',icon:'✧'}],\n    items:[{id:'litter',name:'猫砂盆',note:'把日常照顾和定期清洗都放在一起。'},{id:'purifier',name:'空气净化器',note:'滤芯检查与更换'}],\n    tasks:[first,second,make('铲猫砂','PET',{previousId:second.id,itemId:'litter',repeat:{kind:'interval',days:1}}),\n      make('擦一擦厨房台面','CLEANING',{note:'先收走台面杂物，再用湿布擦拭。做到这里就很好。',important:true,estimatedMinutes:5,energy:'low'}),\n      make('给绿植浇水','PERSONAL',{repeat:{kind:'weekly',weekdays:[2,6]}}),\n      make('把床单换下来','CLEANING',{dueAt:null,estimatedMinutes:10,energy:'medium'}),\n      make('整理玄关的快递盒','CLEANING',{dueAt:null,planScope:'week',weekOf:weekRange(now).start,estimatedMinutes:15,energy:'low'}),\n      make('清洗猫砂盆','PET',{itemId:'litter',dueAt:nextDue(now,{kind:'interval',days:30}),repeat:{kind:'interval',days:30}}),\n      make('检查空气净化器滤芯','ITEMS',{itemId:'purifier',repeat:{kind:'monthly',day:15},dueAt:nextDue(now,{kind:'monthly',day:15})}),\n      make('整理书桌的一角','PERSONAL',{completedAt:today.getTime(),note:'只整理了左手边，也是一点进展。'}),\n      make('给猫梳毛','PET',{completedAt:daysAgo(3),dueAt:daysAgo(3)}),\n      make('给猫做一个纸箱迷宫','IDEA',{dueAt:null,note:'攒几个大小不同的快递箱，无聊时试试看。',estimatedMinutes:30,energy:'medium'}),\n      make('试着养一盆香草','IDEA',{dueAt:null,note:'先看看家里窗台的光照。',estimatedMinutes:15,energy:'low'})],\n    timerCategories:[{id:'HOUSEWORK',name:'家务',icon:'⌂'},{id:'STUDY',name:'学习',icon:'✎'},{id:'READING',name:'看书',icon:'▤'},\n      {id:'HOBBY',name:'兴趣',icon:'✳'},{id:'TV',name:'看电视',icon:'▷'}],\n    timers:[], overrides:{}, shopping:[{id:id(),name:'猫咪饮水机滤芯',note:'确认型号和尺寸后购买',price:59,need:'急 '日历'],['shopping','♧','购物'],['review','↗','复盘']];\nlet remembered='';try{remembered=sessionStorage.getItem('saveadhd-preview-page')||'';}catch{}\nlet route=location.hash.slice(1);try{if(!route&&window.parent!==window)route=window.parent.location.hash.slice(1);}catch{}\nlet page = pages.some(([key]) => key === route) ? route : pages.some(([key])=>key===remembered)?remembered:'today';\nlet filter = 'all', expandedItem = '', selectedDay = dayKey(), month = selectedDay.slice(0,7), dragged = null;\nlet taskTab = 'tasks', shoppingHistory = false, timerHistory = false;\nlet categoryFilter='all',taskSearch='',discoverScope='all',budget=0,currentEnergy='all',pickedId='',filtersOpen=false;\nconst content = document.querySelector('#content'), dialog = document.querySelector('#editor');\nconst h = value => String(value ?? '').replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst shortDate = time => { const date=new Date(time); return `${date.getMonth()+1}月${date.getDate()}日`; };\nconst fullDate = time => new Date(time).toLocaleString('zh-CN',{hour12:false});\nconst ideaCat=()=>ideaCategoryId(state);\nconst cat = key => state.categories.find(category => category.id === key) || state.categories.at(-1);\nconst money = value => value == null ? '待估价' : `¥${Number(value).toLocaleString('zh-CN')}`;\nconst clock = value => { const n = Math.max(0,Math.floor(value)); return [Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(v=>String(v).padStart(2,'0')).join(':'); };\nconst ruleText = rule => rule?.kind === 'interval' ? `每 ${rule.days} 天` : rule?.kind === 'weekly' ? `每周${rule.weekdays.map(d=>'一二三四五六日'[d-1]).join('、')}` : rule?.kind === 'monthly' ? `每月 ${rule.day} 日` : '单次事项';\nconst action = (name, text, record = '', css = 'button') => `\u003cbutton type=\"button\" class=\"${css}\" data-action=\"${name}\" data-id=\"${h(record)}\">${text}\u003c/button>`;\nconst empty = text => `\u003cdiv class=\"empty\">\u003cspan>✳\u003c/span>\u0 lectedDay,state.overrides);\n    open(`\u003cform id=\"work-form\">\u003cdiv class=\"modal-head\">\u003ch2 id=\"dialog-title\">${shortDate(`${selectedDay}T12:00:00`)} 的班次\u003c/h2>${action('close','×','','icon-button')}\u003c/div>\u003cdiv class=\"modal-body\">\u003clabel class=\"inline-check\">\u003cinput type=\"checkbox\" name=\"working\" ${status.working?'checked':''}> 当天上班\u003c/label>\u003cdiv class=\"form-columns\">\u003clabel>开始时间\u003cinput type=\"time\" name=\"start\" value=\"${status.start}\" required>\u003c/label>\u003clabel>结束时间\u003cinput type=\"time\" name=\"end\" value=\"${status.end}\" required>\u003c/label>\u003c/div>\u003cp class=\"form-note\">当天没有上班日程时，日历显示为假期。\u003c/p>\u003cp class=\"form-error\" role=\"alert\">\u003c/p>\u003c/div>\u003cdiv class=\"modal-footer\">${action('work-reset','恢复默认安排','','button subtle')}\u003cbutton type=\"submit\" class=\"button\">保存班次\u003c/button>\u003c/div>\u003c/form>`);return;\n  }\n  if(kind==='move-date') {\n    const task=state.tasks.find(t=>t.id===record);\n    open(`\u003cform id=\"move-form\" data-id=\"${h(record)}\">\u003cdiv class=\"modal-head\">\u003ch2 id=\"dialog-title\">调整完成日期\u003c/h2>${action('close','×','','icon-button')}\u003c/div>\u003cdiv class=\"modal-body\">\u003cp>${h(task.title)}\u003c/p>\u003clabel>完成日期\u003cinput type=\"date\" name=\"day\" required value=\"${dayKey(task.completedAt)}\">\u003c/label>\u003cp class=\"form-note\">重复事项的下一次计划日期会同步重新计算。\u003c/p>\u003c/div>\u003cdiv class=\"modal-footer\">${action('close','取消','','button subtle')}\u003cbutton type=\"submit\" class=\"button\">保存日期\u003c/button>\u003c/div>\u003c/form>`);\n  }\n}\n\ndocument.addEventListener('click',event=>{\n  const categoryButton=event.target.closest('[data-category]');if(categoryButton){categoryFilter=categoryButton.dataset.category;render();return;}\n  const scopeButton=event.target.closest('[data-scope]');if(scopeButton){discoverScope=scopeButton.dataset.scope;render();return;}\n  const taskTabButton=event.target.closest('[data-task-tab]');if(taskTabButton){taskTab=taskTabButton.dataset.taskTab;render();return;}\n  const nav=event.target.closest('[data-page]');if(nav){page=nav.dataset.page;location.hash=page;render();window.scrollTo(0,0);return;}\n  const filterButton=event.target.closest('[data-filter]');if(filterButton){filter=filterButton.dataset.filter;taskTab='tasks';render();return;}\n  const button=event.target.closest('[data-action]');\n  if(button){event.preventDefault();const name=button.dataset.action,key=button.dataset.id;\n    try {\n      if(name==='close')close();\n      else if(name==='toggle-discovery-filters'){filtersOpen=!filtersOpen;render();}\n      else if(name==='idea-new')taskForm('','',true);\n      else if(name==='open-ideas'){page='tasks';taskTab='tasks';categoryFilter=ideaCat();taskSearch='';location.hash='tasks';render();}\n      else if(name==='pick-task'){\n        const groups=discoverGroups(state,{category:categoryFilter,minutes:budget,energy:currentEnergy,search:taskSearch});\n        const picked=pickTask(filterDiscoveryScope(groups,discoverScope),pickedId);if(!picked){toast('当前条件下没有合适的事项，试试放宽时间或精力。');return;}\n        pickedId=picked.id;taskForm(picked.id);toast(`试试这件${picked.estimatedMinutes?'，大约 '+picked.estimatedMinutes+' 分钟':''}：${picked.title}`);\n      }\n      else if(name==='task')taskForm(key);\n      else if(name==='add-task'||name==='add-related')taskForm('',name==='add-related'?key:'');\n      else if(name==='delete-prompt')deletionForm(key);\n      else if(name==='complete') {\n        const task=state.tasks.find(t=>t.id===key);\n        if(task.completedAt){const next=state.tasks.find(t=>t.previousId===key);if(next?.completedAt)throw Error('后续已有完成记录，请从最近一次开始撤销');if(next)state.tasks=state.tasks.filter(t=>t.id!==next.id);task.completedAt=null;}\n        else completeTask(state,key);\n        close();commit(task.completedAt?'完成了一件小事，记下了 ✓':'已撤销完成');\n      }\n      else if(name==='items-tab'){taskTab=taskTab==='items'?'tasks':'items';render();}\n      else if(name==='item-expand'){expandedItem=expandedItem===key?'':key;render();}\n      else if(name==='category-edit')simpleForm('categories',key);\n      else if(['add-item','categories','timer-category','add-shop','shop-detail','work-edit','move-date'].includes(name))simpleForm(name,key);\n      else if(name==='timer-start')timerForm(key);\n      else if(name==='timer-pause') {const timer=state.timers.find(t=>t.id===key);if(timer.startedAt){timer.elapsed=elapsed(timer);timer.startedAt=null;}else timer.startedAt=Date.now();commit();}\n      else if(name==='timer-finish'){finishTimer(state,key);commit('这段时间已记录到日历');}\n      else if(name==='timer-record'){const timer=state.timers.find(t=>t.id===key);toast(`${timer.title} · ${clock(timer.elapsed)}`);}\n      else if(name==='timer-history'){timerHistory=!timerHistory;render();}\n      else if(name==='shopping-history'){shoppingHistory=!shoppingHistory;render();}\n      else if(name==='purchase'){const entry=state.shopping.find(e=>e.id===key);entry.purchasedAt=entry.purchasedAt?null:Date.now();close();commit(entry.purchasedAt?'已购买，保留在购买历史中':'已恢复待购买');}\n      else if(name==='month-prev'||name==='month-next'){const date=new Date(`${month}-01T12:00:00`);date.setMonth(date.getMonth()+(name==='month-next'?1:-1));month=dayKey(date).slice(0,7);render();}\n      else if(name==='month-today'){selectedDay=dayKey();month=selectedDay.slice(0,7);render();}\n      else if(name==='work-reset'){delete state.overrides[selectedDay];close();commit('已恢复默认班休安排');}\n    }catch(error){toast(error.message);}return;\n  }\n  const day=event.target.closest('[data-day]');if(day){selectedDay=day.dataset.day;render();}\n});\ndocument.addEventListener('keydown',event=>{if(event.target.matches('[data-day]')&&['Enter',' '].includes(event.key)){event.preventDefault();selectedDay=event.target.dataset.day;render();}});\ndialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX\u003cr.left||event.clientX>r.right||event.clientY\u003cr.top||event.clientY>r.bottom)close();}});\ndocument.addEventListener('change',event=>{\n  if(event.target.id==='time-budget'){budget=Number(event.target.value);render();}\n  if(event.target.id==='energy-budget'){currentEnergy=event.target.value;render();}\n});\nlet searchTimeout;\ndocument.addEventListener('input',event=>{\n  if(event.target.id!=='task-search')return;\n  taskSearch=event.target.value;const cursor=event.target.selectionStart;\n  clearTimeout(searchTimeout);searchTimeout=setTimeout(()=>{render();const input=document.querySelector('#task-search');input?.focus();input?.setSelectionRange(cursor,cursor);},220);\n});\ndialog.addEventListener('change',event=>{\n  if(event.target.id==='plan-scope'){\n    const dated=event.target.value==='date';document.querySelector('#date-plan').hidden=!dated;\n    const input=dialog.querySelector('[name=dueAt]');input.disabled=!dated;input.required=dated;\n  }\n  if(event.target.id==='repeat-kind'){\n    const kind=event.target.value;\n    for(const type of ['interval','weekly','monthly'])document.querySelector(`#${type}-fields`).hidden=type!==kind;\n    const note=document.querySelector('#conversion-note');if(note)note.hidden=kind==='none';\n    for(const type of ['days','monthDay'])dialog.querySelector(`[name=${type}]`).disabled=kind!==(type==='days'?'interval':'monthly');\n  }\n  if(event.target.id==='timer-mode'){const up=event.target.value==='up';document.querySelector('#minutes-label').hidden=up;dialog.querySelector('[name=minutes]').disabled=up;}\n  if(event.target.name==='mode'&&event.target.closest('#delete-form'))dialog.querySelector('[type=submit]').disabled=false;\n});\ndialog.addEventListener('submit',event=>{\n  event.preventDefault();const form=event.target,data=new FormData(form),key=form.dataset.id;\n  try {\n    if(form.id==='task-form'){\n      const existing=state.tasks.find(t=>t.id===key),kind=data.get('kind');\n      const rule=kind==='interval'?{kind,days:Number(data.get('days'))}:kind==='weekly'?{kind,weekdays:data.getAll('weekdays').map(Number)}:kind==='monthly'?{kind,day:Number(data.get('monthDay'))}:{kind:'none'};\n      if(rule.kind!=='none')nextDue(Date.now(),rule);\n      const title=data.get('title').trim();if(!title)throw Error('请填写事项名称');\n      const planScope=data.get('planScope');\n      let dueAt=planScope==='date'&&data.get('dueAt')?new Date(data.get('dueAt')+'T12:00:00').getTime():null;\n      const minutes=data.get('estimatedMinutes')?Number(data.get('estimatedMinutes')):null;\n      if(minutes!=null&&(!Number.isInteger(minutes)||minutes\u003c1||minutes>1440))throw Error('预计用时应为 1–1440 分钟');\n      saveTask(state,{...(existing||{id:key,createdAt:Date.now(),completedAt:null}),title,note:data.get('note').trim(),category:data.get('category'),itemId:data.get('itemId'),important:data.has('important'),repeat:rule,dueAt,estimatedMinutes:minutes,energy:data.get('energy'),planScope:planScope==='prior-week'?'week':planScope,weekOf:planScope==='week'?weekRange().start:planScope==='prior-week'?existing.weekOf:null});\n      close();commit(existing?'修改已保存':'事项已记下');\n    }     else if(form.id==='delete-form'){deleteTask(state,key,data.get('mode'));close();commit('已按选择处理事项');}\n    else if(form.id==='timer-form'){const title=data.get('title').trim();if(!title)throw Error('请填写计时标题');const minutes=Number(data.get('minutes'));if(data.get('mode')==='down'&&(!Number.isInteger(minutes)||minutes\u003c1||minutes>1440))throw Error('时长应为 1–1440 分钟');startTimer(state,{id:id(),title,category:key,createdAt:Date.now(),startedAt:Date.now(),elapsed:0,completedAt:null,target:data.get('mode')==='up'?null:minutes*60});close();commit('开始专注这一件事');}\n    else if(form.id==='simple-form'){const name=data.get('name').trim();if(!name)throw Error('请填写名称');if(form.dataset.kind==='add-item'){state.items.push({id:id(),name,note:data.get('note').trim()});taskTab='items';}else state.timerCategories.push({id:id(),name,icon:'◷'});close();commit('已添加');}\n    else if(form.id==='category-form'){const name=data.get('name').trim();if(!name)throw Error('请填写分类名称');const existing=state.categories.find(c=>c.id===key);if(existing)Object.assign(existing,{name,color:data.get('color')});else state.categories.push({id:id(),name,color:data.get('color'),icon:'○'});close();commit('分类已保存');}\n    else if(form.id==='shop-form'){const name=data.get('name').trim();if(!name)throw Error('请填写物品名称');const price=data.get('price')===''?null:Number(data.get('price'));if(price!=null&&(!Number.isFinite(price)||price\u003c0||Math.abs(price*100-Math.round(price*100))>0.0001))throw Error('价格须为非负金额，最多两位小数');state.shopping.push({id:id(),name,note:data.get('note').trim(),price,need:data.get('need'),createdAt:Date.now(),purchasedAt:null});close();commit('已加入购物清单');}\n    else if(form.id==='work-form'){const working=data.has('working'),start=data.get('start'),end=data.get('end');if(working&&start>=end)throw Error('下班时间应晚于上班时间');state.overrides[selectedDay]={working,start,end};close();commit('当天班次已调整');}\n    else if(form.id==='move-form'){moveCompletion(state,key,data.get('day'));selectedDay=data.get('day');month=selectedDay.slice(0,7);close();commit('完成日期已更新，下次日期已同步计算');}\n  }catch(error){const node=form.querySelector('.form-error');if(node)node.textContent=error.message;else toast(error.message);}\n});\ndocument.addEventListener('dragstart',event=>{const node=event.target.closest('[data-drag]');if(node){dragged=node.dataset.drag;event.dataTransfer.setData('text/plain',dragged);event.dataTransfer.effectAllowed='move';}});\ndocument.addEventListener('dragover',event=>{const target=event.target.closest('[data-day]');if(target&&dragged){event.preventDefault();target.classList.add('drop-target');}});\ndocument.addEventListener('dragleave',event=>event.target.closest('[data-day]')?.classList.remove('drop-target'));\ndocument.addEventListener('drop',event=>{const target=event.target.closest('[data-day]');if(target&&dragged){event.preventDefault();moveCompletion(state,dragged,target.dataset.day);selectedDay=target.dataset.day;dragged=null;commit('完成记录已移动，下次日期已同步更新');}});\ndocument.addEventListener('dragend',()=>{dragged=null;document.querySelectorAll('.drop-target').forEach(node=>node.classList.remove('drop-target'));});\ndocument.querySelector('#reset').onclick=()=>open(`\u003cform id=\"reset-form\">\u003cdiv class=\"modal-head\">\u003ch2 id=\"dialog-title\">重置预览数据？\u003c/h2>${action('close','×','','icon-button')}\u003c/div>\u003cdiv class=\"modal-body\">\u003cp>会清除当前浏览器中的预览记录，重新载入示例。手机 App 的数据不会受影响。\u003c/p>\u003c/div>\u003cdiv class=\"modal-footer\">${action('close','取消','','button subtle')}\u003cbutton class=\"button destructive\" type=\"submit\">确认重置\u003c/button>\u003c/div>\u003c/form>`);\ndialog.addEventListener('submit',event=>{if(event.target.id==='reset-form'){state=migrateState(seed());close();commit('示例数据已重置');}});\nwindow.addEventListener('hashchange',()=>{if(pages.some(([key])=>key===location.hash.slice(1))){page=location.hash.slice(1);render();}});\nwindow.addEventListener('storage',event=>{if(event.key===KEY&&event.newValue){try{state=migrateState(JSON.parse(event.newValue));if(!dialog.open)render();}catch{}}});\nsetInterval(()=>{\n  let changed=false;\n  for(const timer of state.timers.filter(timer=>!timer.completedAt)){\n    if(timer.target!=null&&timer.startedAt&&elapsed(timer)>=timer.target){finishTimer(state,timer.id,Date.now(),true);changed=true;}\n    const node=document.querySelector(`[data-clock=\"${timer.id}\"]`);if(node)node.textContent=clock(timer.target==null?elapsed(timer):timer.target-elapsed(timer));\n  }\n  if(changed)commit('倒计时结束，已记录到日历');\n},500);\n// Polling preserves local data and waits for open forms to close before refreshing code changes.\nlet version=null;\nconst bundled=document.documentElement.dataset.previewBundle==='true';\nif(window===window.parent&&location.protocol.startsWith('http'))setInterval(async()=>{try{const response=await fetch(bundled?location.pathname:'./__version',{cache:'no-store'});if(!response.ok)return;const latest=await response.text();if(version&&latest!==version&&!dialog.open)location.reload();else if(!version)version=latest;}catch{}},bundled?15000:1800);\npersist();render();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script><script type="module">
const frame=document.querySelector('#app-frame');

function layout(){
  document.body.dataset.device=device;
  document.querySelectorAll('button[data-device]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.device===device)));
  const scale=device==='phone'&&fit?Math.min(1,(window.innerWidth-40)/432,Math.max(.3,(window.innerHeight-(window.innerWidth<700?168:130))/936)):1;
  document.documentElement.style.setProperty('--scale',scale);
  document.querySelector('#fit').hidden=device!=='phone';
  document.querySelector('#fit').textContent=fit?'查看 100%':'适应窗口';
  document.querySelector('#device-info').textContent=device==='phone'?`小米 15 Ultra · 1440 × 3200 屏幕比例 · 模拟视口 412 × 916 CSS px · ${Math.round(scale*100)}%`:'PC 布局 · 随窗口宽度调整';
}
document.querySelectorAll('button[data-device]').forEach(button=>button.onclick=()=>{device=button.dataset.device;try{localStorage.setItem('saveadhd-preview-device',device);}catch{}layout();});
document.querySelector('#fit').onclick=()=>{fit=!fit;layout();};
window.addEventListener('resize',layout);layout();
// Resizing the same iframe preserves forms, route and the running timer.
let version=document.documentElement.dataset.previewRevision||null;
if(location.protocol.startsWith('http'))setInterval(async()=>{
  try{
    const response=await fetch(bundled?location.pathname:'./__version',{cache:'no-store'});
    if(!response.ok)return;
    let latest=await response.text();
    if(bundled)latest=latest.match(/data-preview-revision="([a-f0-9]+)"/)?.[1];
    if(!latest)return;
    const editing=frame.contentDocument?.querySelector('dialog[open]');
    if(version&&latest!==version&&!editing)location.reload();else if(!version)version=latest;
  }catch{}
},bundled?15000:1800);

</script>
</body></html>
