<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf1e8">
<title>桌面小部件 · 手机预览</title>
<style>
:root{font:16px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#284237;background:#edf1e8;--green:#306747;--soft:#526b60;--line:#dce7db;--mint:#d9eee0}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:460px;margin:auto;padding:20px 15px 28px}h1,h2,p{margin:0}h1{font-size:25px;margin-top:10px}p{font-size:13px;color:var(--soft)}a{color:var(--green)}article{margin-top:21px}.option{display:flex;align-items:baseline;gap:9px;margin-bottom:7px}.option h2{font-size:17px}.size{margin-left:auto;color:var(--soft);font-size:12px;white-space:nowrap}.sample{background:#fffdf7;border-radius:20px;padding:11px;box-shadow:0 7px 16px #29463417;border:1px solid #f1f4eb}.caption{margin:7px 3px 0}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}button:focus-visible{outline:2px solid var(--green)}[hidden]{display:none!important}
.bar{display:flex;align-items:center;gap:6px;justify-content:space-between;margin-bottom:8px}.bar strong{font-size:15px}.bar small{color:var(--soft);font-size:11px}.pill{border-radius:99px;padding:4px 8px;background:var(--mint);font-size:11px;color:var(--green);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.tile{background:#f1f5ec;border-radius:10px;padding:4px 1px;text-align:center;font-size:11px;overflow:hidden}.tile>*{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .icon{font-size:18px}.tile small{font-size:10px;color:var(--soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.week button{min-width:0;border-radius:7px;background:#edf2f6;padding:3px 2px;font-size:11px;text-align:center}.week button[aria-pressed=true]{background:var(--mint);color:var(--green)}.week button span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.week button span+span{font-size:9px;margin-top:3px}
.rows{display:grid;gap:4px}.row{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:7px;background:#f1f5ec;min-height:33px;font-size:12px}.row strong{flex:1;font-weight:600}.row input{accent-color:var(--green);height:15px;width:15px}.row small{color:var(--soft)}.row.wide{justify-content:space-between}.summary{padding:6px 4px 0;color:var(--soft);font-size:11px}
.buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.random{border-radius:14px;background:var(--mint);padding:10px 6px;font-size:13px;font-weight:650}.random-result{margin-top:8px;min-height:20px}.line{margin-top:7px}

.widget-settings{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px;font-size:12px}.widget-settings select{color:inherit;background:#fffdf7;padding:3px;border:1px solid #c0d2c5;border-radius:6px}.chores-surface{background:rgba(255,253,247,var(--opacity,1))}.chores-surface .tile{background:rgba(241,245,236,var(--opacity,1))}.random{width:78px;aspect-ratio:1;padding:6px;border-radius:11px;justify-self:center}.random span{display:block;font-size:24px}.week-nav{width:32px;height:32px;background:#e6efe7;border-radius:7px}.bar .range{font-size:12px}
</style>
</head>
<body>
<main class="wrap">
<a href="mobile-calendar-draft.html">‹ 手机预览</a>
<h1>桌面小部件</h1>
<p>点按示例卡片，体验完成、选日期和随机挑选。</p>
<article aria-label="家务小部件">
 <div class="option"><h2>家务</h2><span class="size">4×3</span></div>
 <section class="sample chores-surface" id="choresSurface"><div class="bar"><strong>家务</strong><span class="pill" id="choreCount"></span></div><div class="tiles" id="chores"></div></section>
 <details class="widget-settings"><summary>桌面小部件设置（演示）</summary>
  <label>高度 <select id="choreRows"><option value="1">1 行</option><option value="2">2 行</option><option selected value="3">3 行</option></select></label>
  <label>背景不透明度 <select id="choreOpacity"><option>25%</option><option>50%</option><option>75%</option><option selected>100%</option></select></label>
 </details>
</article>
<article aria-label="任务周视图">
 <div class="option"><h2>任务周视图</h2><span class="size">约 4×3 格</span></div>
 <section class="sample"><div class="bar"><button class="week-nav" id="taskPrev" aria-label="上一周">‹</button><button id="taskRange" class="range" aria-label="回到本周"></button><button class="week-nav" id="taskNext" aria-label="下一周">›</button></div><div class="week" id="week"></div><p class="summary" id="weekSummary"></p></section>
</article>
<article aria-label="任务列表">
 <div class="option"><h2>任务列表</h2><span class="size">不含家务</span></div>
 <section class="sample">

 <div class="rows" id="tasks"></div></section>
 <p class="caption">点方框完成；包含无日期的待办。</p>
</article>
<article aria-label="随机小部件">
 <div class="option"><h2>随机小部件</h2><span class="size">各约 1×1 格，可分别添加</span></div>
 <div class="buttons">
  <div><button class="random" id="houseworkPick"><span>🎲</span>随机家务</button><p class="random-result" id="houseworkResult" aria-live="polite"></p></div>
  <div><button class="random" id="taskPick"><span>🎲</span>随机任务</button><p class="random-result" id="taskResult" aria-live="polite"></p></div>
 </div>
 <p class="caption">两个独立的小部件，点按只挑选，不会自动完成。</p>
</article>
</main>
<script>
const $=id=>document.getElementById(id);
const chores=[
 ['🧹','扫地',7],['🐾','铲猫砂',18],['🧺','换床单',2],['🗑️','倒垃圾',9],
 ['🍽️','洗碗',12],['🧽','擦台面',3],['🧺','收衣服',4],['🧽','洗手池',1],
 ['💧','给花浇水',2],['🧹','整理玄关',3],['🧽','擦餐桌',6],['🧹','清理书桌',1]
].map(([icon,title,count])=>({icon,title,count,done:false}));
const tasks=[
 {title:'交材料',date:26},{title:'准备读书会',date:26},{title:'领取快递',date:27},{title:'整理照片',date:null},{title:'本周复盘',date:33}
];
let selectedDay=26, taskWeek=0;
function text(tag,value){const e=document.createElement(tag);e.textContent=value;return e}
function renderChores(){
 const pending=chores.filter(t=>!t.done);
 $('choreCount').textContent=pending.length+' 件待做';
 $('chores').replaceChildren(...pending.slice(0,Number($('choreRows').value)*4).map(t=>{
  const card=text('button','');card.className='tile';card.setAttribute('aria-label','完成 '+t.title);
  const icon=text('span',t.icon);icon.className='icon';
  card.append(icon,text('span',t.title),text('small','本月已做 '+t.count+' 次'));
  card.onclick=()=>{t.done=true;t.count++;renderChores()};
  return card;
 }));
}
function renderWeek(){
 const days=['一','二','三','四','五','六','日'];
 const start=23+taskWeek*7,end=start+6;
 $('taskRange').textContent=formatDay(start)+' – '+formatDay(end);
 $('week').replaceChildren(...days.map((label,i)=>{
  const day=i+start, group=tasks.filter(t=>!t.done&&t.date===day), btn=text('button','');
  btn.setAttribute('aria-pressed',day===selectedDay);
  btn.append(text('span',label+' '+new Date(2026,10,day).getDate()),text('span',group[0]?.title||'—'));
  btn.onclick=()=>{selectedDay=day;renderWeek()};
  return btn;
 }));
 const titles=tasks.filter(t=>!t.done&&t.date===selectedDay).map(t=>t.title);
 $('weekSummary').textContent=formatDay(selectedDay)+' · '+(titles.join('、')||'没有待办');
}
function formatDay(d){const date=new Date(2026,10,d);return (date.getMonth()+1)+'/'+date.getDate()}
function renderTasks(){
 const pending=tasks.filter(t=>!t.done);
 $('tasks').replaceChildren(...pending.map(t=>{
  const row=text('label','');row.className='row';
  const input=document.createElement('input');input.type='checkbox';input.setAttribute('aria-label','完成 '+t.title);
  input.onchange=()=>{t.done=true;renderTasks();renderWeek()};
  row.append(input,text('strong',t.title),text('small',t.date==null?'无日期':formatDay(t.date)));return row;
 }));
 if(!pending.length)$('tasks').append(text('p','暂时没有待办'));
}
function pick(entries,empty,result){
 const pending=entries.filter(t=>!t.done), choice=pending[Math.floor(Math.random()*pending.length)];
 $(result).textContent=choice?'抽到：'+choice.title:empty;
}
$('houseworkPick').onclick=()=>pick(chores,'没有待做家务','houseworkResult');
$('taskPick').onclick=()=>pick(tasks,'没有待办任务','taskResult');
$('choreRows').onchange=renderChores;
$('choreOpacity').onchange=()=>$('choresSurface').style.setProperty('--opacity',parseInt($('choreOpacity').value,10)/100);
function shift(delta){taskWeek=delta===0?0:taskWeek+delta;selectedDay=delta===0?26:23+taskWeek*7;renderWeek()}
$('taskPrev').onclick=()=>shift(-1);$('taskNext').onclick=()=>shift(1);$('taskRange').onclick=()=>shift(0);
renderChores();renderWeek();renderTasks();
</script>
</body>
</html>
