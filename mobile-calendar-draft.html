<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcfaf4">
<title>拯救ADHD · 手机预览</title>
<style>
:root{color-scheme:light;font:16px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--ink:#243e34;--soft:#66766c;--paper:#fcfaf4;--line:#e3e9df;--green:#386b53;--sage:#e1eee3}
*{box-sizing:border-box}body{margin:0;background:#e8eee6;color:var(--ink)}button,textarea,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}
.phone{width:min(100%,460px);height:100dvh;min-height:500px;margin:auto;background:var(--paper);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:600px){.phone{height:min(916px,calc(100dvh - 36px));margin:18px auto;border:1px solid #ccd9cd;border-radius:28px;box-shadow:0 18px 64px #233b2924}}
.top{display:flex;align-items:center;justify-content:space-between;padding:11px 17px 8px;border-bottom:1px solid #e8eade}.draft{font-size:12px;letter-spacing:.04em;color:var(--soft)}.pill,.subtle,.primary{min-height:37px;padding:6px 13px;border-radius:100px;font-size:13px;font-weight:650;white-space:nowrap}.pill{background:var(--sage);color:#2b5b44}.subtle{background:#efefe6}.primary{background:var(--green);color:white}.plain{min-width:36px;min-height:36px;color:var(--green)}.quiet{font-size:12px;color:var(--soft)}
main{min-height:0;flex:1;display:flex;flex-direction:column}.monthbar{display:flex;align-items:center;gap:6px;padding:12px 14px 3px}h1,h2,p{margin:0}h1{font-size:32px;letter-spacing:-.045em;line-height:1.18}h2{font-size:22px}.year{color:var(--soft);font-size:13px;margin-right:auto}.tools{display:flex;align-items:center;gap:6px;padding:4px 13px 7px}.push{margin-right:auto}.scale{display:flex;align-items:center;border-radius:100px;background:#efefe6}.scale button{min-width:31px;min-height:35px;font-weight:700}.scale span{font-size:11px;color:var(--soft);min-width:32px;text-align:center}.weekdays,.row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{padding:5px 0;color:var(--soft);font-size:12px;text-align:center;background:#f6f8ef}
.scroller{min-height:0;flex:1;overflow:auto;touch-action:pan-y;overscroll-behavior:contain;background:#fafcf8}.row{height:var(--row,80px)}.cell{min-width:0;overflow:hidden;border-top:1px solid var(--line);border-right:1px solid #edf0e8;padding:4px 2px;text-align:center;cursor:pointer}.cell:last-child{border-right:0}.cell.other{background:#f0f3ed;color:#69756b}.cell.selected{background:#e9f1e6}.date{width:25px;height:25px;display:grid;place-items:center;margin:auto;font-size:14px;font-weight:650}.today .date{color:white;background:var(--green);border-radius:50%}.dayhint{font-size:10px;height:16px;color:#577687}.dayhint.off{color:#a2674c}.event{display:block;border-radius:4px;text-align:left;font-size:10px;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:1px 0;padding:0 3px;background:#d7e9ef;color:#284e62}.event.study{background:#ece5f6;color:#4a3a6c}.event.done{background:#e8ebe4;color:#617168}.event.import{background:#e4e2fa;color:#54477d}.more{font-size:10px;color:var(--soft)}
.status{padding-right:81px;min-height:43px;display:flex;align-items:center;justify-content:space-between;padding:2px 81px 2px 14px;border-top:1px solid var(--line);font-size:12px}.status button{padding:6px 0;color:var(--green);font-weight:700}.nav{display:flex;justify-content:stretch;background:#f4f6ec;border-top:1px solid var(--line);padding:5px 7px max(7px,env(safe-area-inset-bottom))}.nav button{flex:1;border-radius:12px;padding:5px 8px;font-size:12px;color:var(--soft)}.nav b{display:block;font-size:19px;font-weight:600}.nav button[aria-current=page]{background:#dcebdd;color:#234b37}
.chores{padding:18px 16px;overflow:auto}.chores h1{margin-bottom:6px}.intro{color:var(--soft);font-size:13px;margin-bottom:18px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{min-height:103px;border-radius:18px;border:1px solid #e1e9da;background:#eef3e8;padding:8px 4px;text-align:center}.tile span{display:block;font-size:28px}.tile strong{display:block;font-size:13px}.tile small{font-size:11px;color:var(--soft)}.finished{margin-top:17px;padding:12px 2px;border-top:1px solid var(--line);color:var(--soft);font-size:13px}.finished summary{cursor:pointer}.finished p{padding:7px 8px}
dialog{max-height:calc(100dvh - 36px);width:min(100%,460px);border:0;border-radius:24px 24px 0 0;margin:auto auto 0;padding:12px 18px max(18px,env(safe-area-inset-bottom));background:var(--paper);color:var(--ink);box-shadow:0 -14px 46px #17291d30}dialog::backdrop{background:#18271d64}.handle{display:block;background:#c9d0c2;width:31px;height:4px;border-radius:4px;margin:0 auto 13px}.sheetheader,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.sheetbody{margin:13px 0;display:grid;gap:9px}.panel{background:#eef2e9;padding:12px;border-radius:13px;font-size:14px}.panel strong{display:block}.panel p{color:var(--soft);margin-top:2px;font-size:12px}.actions{justify-content:flex-end}.actions .push{margin-right:auto}.quiet[role=status]{min-height:18px}
textarea,select{background:#fffdf9;border:1px solid #bdcabb;border-radius:12px;padding:10px;width:100%}textarea{min-height:96px;resize:vertical}.calendarOptions{display:grid;gap:7px}.calendarOptions label{display:flex;gap:8px;align-items:center}.calendarOptions input{accent-color:var(--green)}.toast{position:absolute;bottom:70px;left:50%;translate:-50% 0;background:#254533;color:white;padding:8px 15px;border-radius:100px;font-size:13px;max-width:90%;white-space:nowrap;z-index:5}

.taskpage,.profile,.generic{padding:15px 16px 102px;overflow:auto}.page-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.profile h1,.generic h1{margin-bottom:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 6px}.chips button{white-space:nowrap;font-size:12px;min-height:32px;border-radius:100px;padding:4px 11px;background:#f0f0e8}.chips button[aria-pressed=true]{background:var(--sage);color:#28563e;font-weight:700}.tasktools{display:flex;align-items:center;gap:8px}.tasktools .chips{min-width:0;flex:1}.tasktools>button{flex:none}.taskrows{display:grid;gap:7px;margin-top:10px}.taskline{display:flex;align-items:center;gap:4px;min-height:50px;padding:0 10px 0 3px;border-radius:12px;background:#edf2e9;border-left:3px solid #82aa91}.taskline.study{background:#efebf7;border-color:#a799c6}.taskline.done{background:#edf0ea;border-color:#b8c5b9;color:#65746b}.check{width:39px;min-height:44px;color:var(--green);font-size:20px}.taskname{flex:1;text-align:left;padding:6px 2px;font-weight:600}.daylabel{font-size:11px;color:var(--soft);white-space:nowrap}.taskpage .tiles{margin-top:10px}.subheading{font-size:13px;color:var(--soft);margin-top:13px}.entry{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fffdf7;border:1px solid var(--line);border-radius:16px;min-height:67px;padding:11px 13px;margin:8px 0}.entry-icon{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:var(--sage);color:var(--green);font-size:18px}.entry>span:nth-child(2){flex:1}.entry strong,.entry small{display:block}.entry small{font-size:12px;color:var(--soft)}.entry .arrow{color:var(--green)}.nav button{min-width:0;padding-inline:2px;font-size:11px;white-space:nowrap}.nav b{font-size:18px;height:25px}
.quick{position:absolute;right:15px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:3;display:flex;align-items:flex-end;flex-direction:column;gap:8px}.quick-toggle{width:54px;height:54px;border-radius:17px;background:var(--green);color:#fff;font-size:28px;box-shadow:0 4px 14px #234e3a38}.quick-actions{display:grid;gap:4px;padding:6px;background:#fffef9;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px #24423328}.quick-actions button{min-height:39px;text-align:left;padding:6px 12px;font-size:14px}.basicInput{width:100%;border:1px solid #bdcabb;border-radius:12px;padding:10px;background:#fffdf9;color:var(--ink);font:inherit}

#calendar .monthbar{min-height:46px;padding:4px 7px 2px;gap:1px}#calendar .monthbar h1{font-size:23px;margin-left:4px}#calendar .year{font-size:11px;margin-right:auto;margin-left:4px}
#calendar .monthbar .plain{min-width:34px;padding-inline:4px}#calendar .monthbar #today{min-width:42px;font-size:12px}#calendar .monthbar .scale{margin-left:3px}#calendar .monthbar .scale button{min-width:30px;min-height:32px}#calendar .monthbar .scale span{font-size:10px;min-width:26px}
.cell.workday{background:#f0f6fc}.cell.holiday{background:#fff1e8}.cell.other.workday{background:#e9eff5}.cell.other.holiday{background:#f6ede5}.cell.selected{box-shadow:inset 0 0 0 1.5px #75a18a}.weekdays{padding:3px 0}
.wish-card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fffdf8;border-radius:16px;padding:13px 14px;margin:8px 0}.wish-card strong,.wish-card span,.wish-card small{display:block}.wish-card span{margin:3px 0;font-size:14px}.wish-card small{color:var(--soft)}.detail-heading{margin-top:5px;font-size:15px}.subtask{display:flex;align-items:center;gap:7px;min-height:45px;background:#eef2e9;border-radius:10px;padding:2px 9px}.subtask input{accent-color:var(--green);width:17px;height:17px}.subtask button{text-align:left;flex:1}.subtask.done button{color:var(--soft);text-decoration:line-through}.taskline.child{margin-left:13px}
</style>
</head>
<body>
<div class="phone">
  <header class="top"><span class="draft">拯救ADHD · 手机预览</span></header>
  <main id="calendar" hidden>
    <div class="monthbar"><h1 id="month"></h1><span class="year" id="year"></span>
      <button class="plain" id="prev" aria-label="上个月">‹</button><button class="plain" id="today">今天</button><button class="plain" id="next" aria-label="下个月">›</button>
      <button class="plain" id="filter" aria-label="日历类别筛选">☷</button>
      <div class="scale"><button id="smaller" aria-label="缩小行高">−</button><span id="ratio">100%</span><button id="larger" aria-label="放大行高">＋</button></div>
    </div>
    <div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <section class="scroller" id="grid" aria-label="七列月历"></section>
    <div class="status"><button id="dayButton"></button><span class="quiet">双指张开拉高</span></div>
  </main>
  <main id="tasks" class="taskpage">
    <div class="page-title"><h1>事项</h1><button id="pickTask" class="pill">帮我挑一件</button></div>
    <div class="chips" id="categories" aria-label="事项分类"></div>
    <div class="tasktools"><div class="chips" id="dates" aria-label="日期筛选"></div><button id="taskFilter" class="subtle">筛选</button></div>
    <div id="taskRows"></div>
    <details class="finished"><summary id="doneCount">已完成 · 0</summary><div id="doneItems"></div></details>
  </main>
  <main id="timer" class="generic" hidden><h1>计时</h1><div id="timerEntries"></div></main>
  <main id="shopping" class="generic" hidden><h1>心愿清单</h1><div id="shoppingEntries"></div></main>
  <main id="mine" class="profile" hidden>
    <h1>我的</h1>
    <button class="entry" id="settings"><span class="entry-icon">⚙</span><span><strong>个人设置</strong><small>通知、准确提醒和计时浮窗</small></span><span class="arrow">›</span></button>
    <button class="entry" id="sync"><span class="entry-icon">↻</span><span><strong>WebDAV 同步</strong><small>账户、自动同步和冲突处理</small></span><span class="arrow">›</span></button>
    <button class="entry" id="import"><span class="entry-icon">↓</span><span><strong>导入手机日历</strong><small id="importStatus">读取小米日历等系统日程</small></span><span class="arrow">›</span></button>
    <button class="entry" id="manage"><span class="entry-icon">▣</span><span><strong>管理分类</strong><small>名称、图标和颜色</small></span><span class="arrow">›</span></button>
    <button class="entry" id="review"><span class="entry-icon">▥</span><span><strong>复盘</strong><small>查看完成记录和统计</small></span><span class="arrow">›</span></button>
  </main>
  <div class="quick" id="quick">
    <div id="quickActions" class="quick-actions" hidden><button id="addPrimary">添加事项</button><button data-idea>记想法</button></div>
    <button id="quickToggle" class="quick-toggle" aria-label="快捷添加" aria-expanded="false">＋</button>
  </div>
  <nav class="nav" aria-label="主导航">
    <button data-nav="tasks" aria-current="page"><b>☑</b>事项</button><button data-nav="calendar"><b>▦</b>日历</button>
    <button data-nav="timer"><b>◷</b>计时</button><button data-nav="shopping"><b>♡</b>心愿清单</button><button data-nav="mine"><b>◉</b>我的</button>
  </nav>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<dialog id="sheet"><span class="handle"></span><div class="sheetheader"><h2 id="sheetTitle"></h2><button class="plain" id="close" aria-label="关闭">✕</button></div><div class="sheetbody" id="sheetBody"></div></dialog>
<script>
const $ = id => document.getElementById(id);
const sampleToday = new Date(2026,10,26);
const same = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const dateKey = d => [d.getFullYear(),d.getMonth()+1,d.getDate()].join('-');
const sampleEvents = {
 '2026-11-17':[{title:'寄出退货',kind:'general',done:true}],
 '2026-11-21':[{title:'摄影练习',kind:'study',done:true}],
 '2026-11-24':[{title:'预约体检',kind:'general',done:true}],
 '2026-11-25':[{title:'读书笔记',kind:'study',done:true}],
 '2026-11-26':[{title:'准备读书会',kind:'study'},{title:'交材料',kind:'general'}],
 '2026-11-27':[{title:'读完第三章',kind:'study'},{title:'领取快递',kind:'general'}],
 '2026-11-28':[{title:'整理照片',kind:'general'}],
 '2026-11-30':[{title:'月末复盘',kind:'general'}]
};
const importedEvents = {
 '2026-11-26':[{title:'牙科复诊',kind:'import',time:'16:30'}],
 '2026-11-28':[{title:'周六羽毛球',kind:'import',time:'10:00'}],
 '2026-12-1':[{title:'取报告',kind:'import',time:'15:00'}]
};
const chores=[
 ['🧹','扫地','今天'],['🐾','铲猫砂','今天'],['🧺','换床单','本周'],
 ['🍽️','洗碗','今天'],['🧽','擦厨房台面','今天'],['🗑️','倒垃圾','今天']
];
let selection=sampleToday, page=new Date(2026,10,1), zoom=1, imported=false, selectedKinds=new Set(), completed=new Set(), notes=[];
let view='tasks', taskKind='all', dateScope='all', search='', nextTaskId=1, minFilter=0, energyLimit=2;
const localTasks=[
 {id:'study-1',title:'准备读书会',kind:'study',date:new Date(2026,10,26),minutes:25,energy:1},
 {id:'general-1',title:'交材料',kind:'general',date:new Date(2026,10,26),minutes:10,energy:0},
 {id:'general-2',title:'领取快递',kind:'general',date:new Date(2026,10,27),minutes:5,energy:0},
 {id:'study-2',title:'读完第三章',kind:'study',date:new Date(2026,10,27),minutes:30,energy:1},
 {id:'general-3',title:'整理照片',kind:'general',date:null,minutes:45,energy:2}
];
localTasks.push(
 {id:'study-child-1',parentId:'study-1',title:'列出讨论提纲',kind:'study',date:null,minutes:10,energy:0},
 {id:'study-child-2',parentId:'study-1',title:'选一段想分享的文字',kind:'study',date:null,minutes:5,energy:0}
);
const shoppingItems=[
 {name:'周末短途旅行',detail:'想找一个周末去附近的镇子走走，顺便拍些照片。',done:false,
  steps:[{title:'查一查路线',done:true},{title:'选个周末',done:false}]},
 {name:'换一台咖啡机',detail:'放得下，日常清洗方便。',done:false,steps:[]}
];
const taskCategories={all:'全部',cleaning:'家务',general:'事项',study:'学习'};
const dateScopes={all:'全部日期',today:'今天',week:'本周',none:'无日期'};

try { notes=JSON.parse(localStorage.getItem('personald-mobile-draft-notes')||'[]'); } catch {}
const kindName={general:'事项',study:'学习'};
function make(tag,text,cls){const el=document.createElement(tag);if(text)el.textContent=text;if(cls)el.className=cls;return el}
function button(label,cls,run){const b=make('button',label,cls);b.onclick=run;return b}
function eventsFor(day){
 const original=(sampleEvents[dateKey(day)]||[]).filter(e=>!localTasks.some(t=>t.title===e.title));
 const planned=localTasks.filter(t=>t.kind!=='cleaning'&&same(t.finished||t.date||new Date(0),day))
   .map(t=>({title:t.title,kind:t.kind,done:!!t.finished}));
 return original.concat(planned).filter(e=>!selectedKinds.size||selectedKinds.has(e.kind)).concat(
   imported&&!selectedKinds.size ? importedEvents[dateKey(day)]||[] : []);
}
function openSheet(title){
 $('sheetTitle').textContent=title;$('sheetBody').replaceChildren();
 if(!$('sheet').open)$('sheet').showModal();return $('sheetBody');
}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,2300)}
function renderGrid(){
 $('month').textContent=(page.getMonth()+1)+'月';$('year').textContent=page.getFullYear();
 $('filter').textContent=selectedKinds.size?'☷·':'☷';$('filter').setAttribute('aria-label',selectedKinds.size?'日历类别筛选，已选 '+selectedKinds.size+' 类':'日历类别筛选，全部类别');
 const base=Math.max(58,Math.floor($('grid').clientHeight/6));const height=Math.round(base*zoom);
 $('grid').style.setProperty('--row',height+'px');$('ratio').textContent=Math.round(zoom*100)+'%';
 $('smaller').disabled=zoom<=1;$('larger').disabled=zoom>=2.8;
 const start=new Date(page);start.setDate(1-(page.getDay()+6)%7);
 const weeks=[];
 for(let row=0;row<6;row++){
  const line=make('div','','row');
  for(let col=0;col<7;col++){
   const day=new Date(start);day.setDate(start.getDate()+row*7+col);
   const cell=make('div','','cell');cell.tabIndex=0;cell.setAttribute('role','button');cell.setAttribute('aria-label',dateKey(day)+' 日程');
   if(day.getMonth()!==page.getMonth())cell.classList.add('other');
   cell.classList.add(col>4?'holiday':'workday');
   if(same(day,sampleToday))cell.classList.add('today');
   if(same(day,selection))cell.classList.add('selected');
   const open=()=>{selection=day;renderGrid();openDay(day)};
   cell.onclick=open;cell.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
   cell.append(make('span',day.getDate(),'date'),make('div',col>4?'假':'班','dayhint'+(col>4?' off':'')));
   const events=eventsFor(day), slots=Math.max(1,Math.floor((height-46)/19));
   const count=events.length>slots&&slots>1?slots-1:slots;
   events.slice(0,count).forEach(e=>cell.append(make('span',(e.done?'✓ ':'')+e.title,'event '+e.kind+(e.done?' done':''))));
   if(events.length>count&&slots>1)cell.append(make('span','+'+(events.length-count),'more'));
   line.append(cell);
  }
  weeks.push(line);
 }
 $('grid').replaceChildren(...weeks);
 $('dayButton').textContent=(selection.getMonth()+1)+'月'+selection.getDate()+'日 · '+eventsFor(selection).length+' 项 ›';
}
function openDay(day){
 selection=day;
 const body=openSheet((day.getMonth()+1)+'月'+day.getDate()+'日');
 const events=eventsFor(day);
 if(!events.length)body.append(make('p','这天没有可显示的日程。','quiet'));
 for(const e of events){
  const item=make('div','','panel');item.append(make('strong',(e.done?'✓ ':'')+e.title),make('p',e.kind==='import'?'小米日历示例 · '+e.time:(taskCategories[e.kind]||"事项")+(e.done?' · 已完成':'')));body.append(item);
 }
 const actions=make('div','','actions');
 actions.append(button('＋ 添加事项','primary',()=>$('addPrimary').onclick()));
 body.append(actions);
}
function setMonth(delta){page=new Date(page.getFullYear(),page.getMonth()+delta,1);selection=new Date(page);$('grid').scrollTop=0;renderGrid()}
$('prev').onclick=()=>setMonth(-1);$('next').onclick=()=>setMonth(1);
$('today').onclick=()=>{page=new Date(2026,10,1);selection=sampleToday;$('grid').scrollTop=0;renderGrid()};
$('dayButton').onclick=()=>openDay(selection);
function scale(next, anchor=$('grid').clientHeight/2){
 const view=$('grid'), position=view.scrollTop+anchor, previous=zoom;
 zoom=Math.min(2.8,Math.max(1,next));renderGrid();view.scrollTop=position*(zoom/previous)-anchor;
}
$('larger').onclick=()=>scale(zoom*1.28);$('smaller').onclick=()=>scale(zoom/1.28);
let pinchDistance=0, multitouch=false;
function touchScale(e){
 if(e.touches.length!==2){pinchDistance=0;return}
 e.preventDefault();multitouch=true;
 const [a,b]=e.touches;const distance=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
 if(pinchDistance>12&&distance>12)scale(zoom*distance/pinchDistance,(a.clientY+b.clientY)/2-$('grid').getBoundingClientRect().top);
 pinchDistance=distance;
}
const grid=$('grid');
grid.addEventListener('touchstart',touchScale,{passive:false});
grid.addEventListener('touchmove',touchScale,{passive:false});
for(const name of ['touchend','touchcancel'])grid.addEventListener(name,e=>{if(e.touches.length<2)pinchDistance=0;if(!e.touches.length)setTimeout(()=>multitouch=false,200)});
grid.addEventListener('click',e=>{if(multitouch){e.preventDefault();e.stopPropagation()}},true);
$('filter').onclick=()=>{
 const body=openSheet('日历类别'), list=make('div','','calendarOptions');
 for(const [key,name] of Object.entries(kindName)){
  const line=make('div','','sheetheader'), label=make('label',name), input=make('input');
  input.type='checkbox';input.checked=selectedKinds.has(key);
  input.onchange=()=>{input.checked?selectedKinds.add(key):selectedKinds.delete(key);renderGrid()};
  label.prepend(input);
  line.append(label,button('只看','plain',()=>{selectedKinds=new Set([key]);renderGrid();$('sheet').close()}));list.append(line);
 }
 body.append(list,button('显示全部','subtle',()=>{selectedKinds.clear();renderGrid();$('sheet').close()}));
};
$('import').onclick=()=>{
 const body=openSheet('导入手机日历');
 body.append(make('p','网页使用示例日程。安卓会先请求读取权限，再让你挑选手机日历。','quiet'));
 const card=make('div','','panel');card.append(make('strong','小米日历 · 个人日程'), make('p','牙科复诊、周六羽毛球、取报告'));
 body.append(card,button(imported?'重新导入示例':'导入 3 条示例日程','primary',()=>{imported=true;selectedKinds.clear();$('importStatus').textContent='本机已导入 3 条示例日程';$('sheet').close();toast('已导入 3 条示例日程')}));
};
function addSubtask(done, onReturn, existing){
 const body=openSheet(existing?'编辑子任务':'添加子任务'), input=make('input','','basicInput'), actions=make('div','','actions');
 input.placeholder='子任务名称';input.value=existing?.title||'';
 actions.append(button('取消','subtle',onReturn),button('保存','primary',()=>{
  const title=input.value.trim();if(!title){input.focus();return}
  done(title);onReturn();
 }));
 body.append(input,actions);
 input.focus();
}
function subtaskRow(title, done, toggle, edit){
 const row=make('div','','subtask'+(done?' done':'')), check=make('input');
 check.type='checkbox';check.checked=done;check.setAttribute('aria-label','完成 '+title);
 check.onchange=()=>toggle(check.checked);
 row.append(check,button(title,'',edit));
 return row;
}
function openTask(title, date, category, task){
 const body=openSheet(title);
 body.append(make('p',(category||'事项')+' · '+(date||'无日期'),'panel'));
 const record=task||localTasks.find(t=>t.title===title);
 if(!record)return;
 const redraw=()=>{renderTasks();openTask(title,date,category,record)};
 const own=subtaskRow('完成主任务',!!record.finished,done=>{record.finished=done?sampleToday:null;redraw()},()=>{});
 own.querySelector('input').setAttribute('aria-label','完成主任务');
 body.append(own);
 const children=localTasks.filter(t=>t.parentId===record.id);
 body.append(make('strong','子任务 · '+children.filter(t=>t.finished).length+'/'+children.length,'detail-heading'));
 for(const child of children)body.append(subtaskRow(child.title,!!child.finished,done=>{
  child.finished=done?sampleToday:null;redraw();
 },()=>openTask(child.title,child.date?dateKey(child.date):'',taskCategories[child.kind],child)));
 const actions=make('div','','actions');actions.append(button('＋ 子任务','primary',()=>addSubtask(name=>{
  localTasks.push({id:'new-'+nextTaskId++,parentId:record.id,title:name,kind:record.kind,date:null,energy:0});
 },redraw)));
 body.append(actions);
}
function choreCards(){
 return chores.map(([icon,title,date],i)=>{
  if(completed.has(i)||!title.includes(search)||dateScope==='none'||(dateScope==='today'&&date!=='今天'))return null;
  const tile=button('','tile',()=>{if(tile.longPressed){tile.longPressed=false;return}completed.add(i);renderTasks();toast('已完成 · '+title)});
  tile.setAttribute('aria-label','完成 '+title);tile.append(make('span',icon),make('strong',title),make('small',date));
  let timeout;function cancel(){clearTimeout(timeout)}
  tile.onpointerdown=()=>{tile.longPressed=false;timeout=setTimeout(()=>{tile.longPressed=true;openTask(title,date,'家务')},550)};
  tile.onpointerup=cancel;tile.onpointercancel=cancel;tile.onpointerleave=cancel;
  tile.oncontextmenu=e=>e.preventDefault();return tile;
 }).filter(Boolean);
}
function taskMatches(t){
 if(taskKind!=='all'&&t.kind!==taskKind)return false;
 if(!t.title.includes(search)|| (minFilter && (t.minutes==null||t.minutes>minFilter)) || t.energy>energyLimit)return false;
 const d=t.finished||t.date;
 if(dateScope==='today')return !!d&&(same(d,sampleToday)||(!t.finished&&d<sampleToday));
 if(dateScope==='week')return !!d&&d<new Date(2026,10,30)&&(!t.finished||d>=new Date(2026,10,23));
 if(dateScope==='none')return !t.date;
 return true;
}
function renderChips(id, values, selected, change){
 $(id).replaceChildren(...Object.entries(values).map(([key,label])=>{
  const btn=button(label,'',()=>change(key));btn.setAttribute('aria-pressed',String(selected===key));return btn;
 }));
}
function renderTasks(){
 renderChips('categories',taskCategories,taskKind,value=>{taskKind=value;renderTasks()});
 renderChips('dates',dateScopes,dateScope,value=>{dateScope=value;renderTasks()});
 const rows=make('div','','taskrows');
 const due=t=>t.date?t.date.getMonth()+1+'月'+t.date.getDate()+'日':'无日期';
 const shown=localTasks.filter(t=>!t.finished&&taskMatches(t));
 $('pickTask').disabled=!shown.length;
 $('pickTask').onclick=()=>{const t=shown[0];if(t)openTask(t.title,due(t),taskCategories[t.kind],t)};
 if(taskKind==='cleaning'){
  const tiles=make('div','','tiles');tiles.append(...choreCards());
  rows.append(make('p','点图标完成 · 长按查看详情','subheading'),tiles);
 }
 for(const t of shown){
  const isChild=t.parentId&&shown.some(parent=>parent.id===t.parentId);
  const line=make('div','','taskline '+t.kind+(isChild?' child':'')), check=button('○','check',()=>{t.finished=sampleToday;renderTasks();toast('已完成 · '+t.title)});
  check.setAttribute('aria-label','完成 '+t.title);
  line.append(check,button(t.title,'taskname',()=>openTask(t.title,due(t),taskCategories[t.kind],t)),make('span',due(t),'daylabel'));
  rows.append(line);
 }
 if(!shown.length&&taskKind!=='cleaning')rows.append(make('p','没有符合筛选条件的待办','quiet'));
 $('taskRows').replaceChildren(rows);
 const done=localTasks.filter(t=>t.finished&&taskMatches(t)).map(t=>make('p','✓ '+t.title));
 if(taskKind==='all'||taskKind==='cleaning')done.push(...[...completed].map(i=>make('p','✓ '+chores[i][1])));
 $('doneCount').textContent='已完成 · '+done.length;
 $('doneItems').replaceChildren(...done);
}
$('taskFilter').onclick=()=>{
 const body=openSheet('筛选事项'), field=make('input','','basicInput'), minutes=make('select'), energy=make('select');
 field.placeholder='搜索事项名称或说明';field.value=search;
 for(const t of [0,5,15,30,60])minutes.add(new Option(t?t+' 分钟内':'时间不限',t));
 for(const [i,label] of ['轻松','普通','精力不限'].entries())energy.add(new Option(label,i));
 minutes.value=minFilter;energy.value=energyLimit;
 body.append(field,minutes,energy,button('应用筛选','primary',()=>{search=field.value.trim();minFilter=Number(minutes.value);energyLimit=Number(energy.value);renderTasks();$('sheet').close()}));
};
function setQuick(expanded){
 $('quickActions').hidden=!expanded;$('quickToggle').setAttribute('aria-expanded',String(expanded));$('quickToggle').textContent=expanded?'×':'＋';
}
$('quickToggle').onclick=()=>setQuick($('quickActions').hidden);
$('addPrimary').onclick=()=>{
 setQuick(false);
 const isShop=view==='shopping', body=openSheet(isShop?'添加心愿':'添加事项'), field=make('input','','basicInput');
 field.placeholder=isShop?'心愿名称':'事项名称';
 body.append(field);
 const detail=make('textarea');
 if(isShop){detail.placeholder='心愿详情（选填）';body.append(detail)}
 const category=make('select');
 if(!isShop){
  for(const [key,label] of Object.entries(taskCategories).filter(([key])=>key!=='all'))category.add(new Option(label,key));
  category.value=view==='calendar'?(selectedKinds.values().next().value||'general'):(taskKind==='all'?'general':taskKind);
  body.append(category);
  if(view==='calendar')body.append(make('p','计划日期 · '+dateKey(selection),'quiet'));
 }
 body.append(button('添加','primary',()=>{
  const title=field.value.trim();if(!title){field.focus();return}
  if(isShop){shoppingItems.push({name:title,detail:detail.value.trim(),done:false,steps:[]});renderShopping()}
  else {localTasks.push({id:'new-'+nextTaskId++,title,kind:category.value,date:view==='calendar'?selection:null,energy:0});if(view==='calendar')renderGrid();else renderTasks()}
  $('sheet').close();toast('已添加');
 }));
 field.focus();
};
function wishDetail(wish){
 const body=openSheet('心愿详情'), redraw=()=>{renderShopping();wishDetail(wish)};
 const heading=make('div','','panel');heading.append(make('strong',wish.name));
 if(wish.detail)heading.append(make('p',wish.detail));
 body.append(heading,subtaskRow('标记已实现',wish.done,done=>{wish.done=done;redraw()},()=>{}));
 body.append(make('strong','子任务 · '+wish.steps.filter(step=>step.done).length+'/'+wish.steps.length,'detail-heading'));
 wish.steps.forEach(step=>body.append(subtaskRow(step.title,step.done,done=>{step.done=done;redraw()},()=>addSubtask(title=>{
  step.title=title;
 },redraw,step))));
 const actions=make('div','','actions');actions.append(button('＋ 子任务','primary',()=>addSubtask(title=>wish.steps.push({title,done:false}),redraw)));
 body.append(actions);
}
function renderShopping(){
 const items=shoppingItems.map(item=>{
  const card=button('','wish-card',()=>wishDetail(item));
  card.append(make('strong',(item.done?'✓ ':'')+item.name));
  if(item.detail)card.append(make('span',item.detail));
  if(item.steps.length)card.append(make('small',item.steps.filter(step=>step.done).length+'/'+item.steps.length+' 子任务'));
  return card;
 });
 $('shoppingEntries').replaceChildren(...items);
}
let timerStarted=0,timerElapsed=0;
const timerDisplay=make('strong','00:00'), timerButton=button('开始计时','primary',()=>{
 if(timerStarted){timerElapsed+=Date.now()-timerStarted;timerStarted=0;timerButton.textContent='继续计时'}
 else{timerStarted=Date.now();timerButton.textContent='暂停'}
 renderTime();
});
function renderTime(){const seconds=Math.floor((timerElapsed+(timerStarted?Date.now()-timerStarted:0))/1000);timerDisplay.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
setInterval(renderTime,250);
const timerCard=make('div','','panel');timerCard.append(make('p','专注时长'),timerDisplay,timerButton);
$('timerEntries').append(timerCard);
$('settings').onclick=()=>{
 const body=openSheet('个人设置');
 for(const prompt of ['通知权限与声音','准确提醒','计时悬浮窗权限'])body.append(make('div',prompt,'panel'));
 body.append(make('p','这些项目在安卓里会打开对应的系统设置。','quiet'));
};
$('sync').onclick=()=>{
 const body=openSheet('WebDAV 同步');
 body.append(make('div','尚未配置同步账户','panel'),make('p','可在安卓中设置 WebDAV 地址、测试连接并处理同步冲突。','quiet'));
};
$('manage').onclick=()=>{
 const body=openSheet('管理分类'), field=make('input','','basicInput');
 field.placeholder='自定义类别名称';
 body.append(make('div',Object.values(taskCategories).slice(1).join(' · '),'panel'),field,button('新增分类','primary',()=>{
  const label=field.value.trim();if(!label)return;
  taskCategories['custom-'+nextTaskId++]=label;$('sheet').close();toast('类别已添加');
 }));
};
function navigate(name){
 view=name;
 for(const nav of document.querySelectorAll('[data-nav]')){
  const current=nav.dataset.nav===name;
  $(nav.dataset.nav).hidden=!current;
  nav.setAttribute('aria-current',current?'page':'false');
 }
 setQuick(false);
 $('quick').hidden=!['tasks','calendar','shopping'].includes(name);
 $('addPrimary').textContent=name==='shopping'?'添加心愿':'添加事项';
 if(name==='calendar')renderGrid();
 if(name==='tasks')renderTasks();
 if(name==='shopping')renderShopping();

}
$('review').onclick=()=>openSheet('复盘').append(make('div','已完成 '+(completed.size+localTasks.filter(t=>t.finished).length)+' 项','panel'));
document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>navigate(el.dataset.nav));
function idea(){
 setQuick(false);
 const body=openSheet('记个想法'), topic=make('select'), field=make('textarea'), noteList=make('div','','sheetbody');
 for(const name of ['随手想法','准备读书会','整理照片'])topic.add(new Option(name));
 topic.setAttribute('aria-label','关联事项');field.placeholder='想到什么，先记下来…';field.setAttribute('aria-label','想法内容');
 const showNotes=()=>{noteList.replaceChildren(...notes.filter(n=>n.topic===topic.value).map(n=>make('div',n.text,'panel')));noteList.hidden=!noteList.childNodes.length};
 topic.onchange=showNotes;
 const actions=make('div','','actions');
 actions.append(button('🎙 语音示例','subtle push',()=>{field.value=[field.value.trim(),'下次读书会可以试试先交换各自最喜欢的一段。'].filter(Boolean).join('\n');field.focus()}),
 button('保存','primary',()=>{const text=field.value.trim();if(!text){field.focus();return}notes.push({topic:topic.value,text});try{localStorage.setItem('personald-mobile-draft-notes',JSON.stringify(notes))}catch{}field.value='';showNotes();toast('想法已保存')}));
 body.append(topic,field,actions,make('p','语音按钮演示转文字后的效果。','quiet'),noteList);showNotes();field.focus();
}
document.querySelectorAll('[data-idea]').forEach(el=>el.onclick=idea);
$('close').onclick=()=>$('sheet').close();
$('sheet').addEventListener('click',e=>{if(e.target!==$('sheet'))return;const r=$('sheet').getBoundingClientRect();if(e.clientY<r.top||e.clientX<r.left||e.clientX>r.right)$('sheet').close()});
window.addEventListener('resize',()=>{if(!$('calendar').hidden)renderGrid()});
navigate('tasks');
</script>
